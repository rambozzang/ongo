server {
    listen 80;
    server_name ongo.codelabtiger.com;

    # Vite emits content-hashed assets. Never send index.html for a missing
    # JavaScript chunk: an old tab can then see a clear 404 and the SPA's
    # dynamic-import recovery can reload the current release.
    location /assets/ {
        root /data/ongo/www;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Frontend Static Files
    location / {
        root /data/ongo/www;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API Proxy
    location /api/ {
        proxy_pass http://localhost:8070/api/;
        # 업로드 본문 상한. 백엔드가 실제로 허용하는 크기와 같게 맞춘다
        # (FileValidationUtil.DEFAULT_MAX_FILE_SIZE = 2GB, AssetController 도 2GB).
        #
        # nginx 기본값은 1MB 다. 명시하지 않으면 에셋 업로드(POST /api/v1/assets),
        # 이미지 게시(POST /api/v1/videos/{id}/images), 쇼츠 시트·템플릿 업로드가
        # 1MB 를 넘는 순간 프록시에서 413 으로 잘린다 — 백엔드까지 닿지도 않아
        # 서버 로그에 아무것도 남지 않는다.
        #
        # **영상 업로드는 여기를 지나지 않는다.** presigned URL 로 R2 에 직접 PUT 하고
        # (usePresignedUpload), 이 경로로는 작은 JSON(init/complete)만 오간다.
        #
        # `location /api/` 안에만 둔다. 정적 파일과 웹소켓은 큰 요청 본문을 받지 않으므로
        # 서버 전체로 올리면 필요 없는 곳까지 버퍼 한도를 넓히는 것이 된다.
        client_max_body_size 2g;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 백엔드 헬스 체크.
    #
    # **`=` 정확 일치다. `/actuator/` 전체를 열지 않는다.**
    #
    # 이 룰이 없으면 `/actuator/health` 가 위의 `location /` 로 떨어져
    # `try_files ... /index.html` 이 프론트 HTML 을 돌려준다. 그래서 백엔드가 죽어도
    # 홈페이지는 열리고 헬스 조회는 200 을 반환한다 — **밖에서는 정상으로 보인다.**
    # 실제로 그 상태로 운영 장애를 놓친 적이 있다.
    #
    # 노출해도 안전한 이유는 백엔드 설정에 있다. `management.endpoints.web.exposure.include`
    # 가 `health` 하나뿐이라 다른 엔드포인트는 HTTP 로 나오지 않고,
    # `show-details: when-authorized` 라 익명 호출자는 `{"status":"UP"}` 만 받는다.
    # 그래도 경로를 넓히지 않는 것은 그 설정이 바뀌어도 여기서 막히게 하기 위해서다.
    location = /actuator/health {
        proxy_pass http://localhost:8070/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 죽은 upstream 을 오래 붙들지 않는다. 헬스 조회는 빨리 실패해야 한다.
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        # 모니터링 폴링이 액세스 로그를 채우지 않게 한다.
        access_log off;
    }

    # WebSocket (STOMP over SockJS)
    location /ws/ {
        proxy_pass http://localhost:8070/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}
