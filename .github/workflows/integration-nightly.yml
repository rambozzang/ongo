name: Integration tests (nightly)

on:
  schedule:
    - cron: '17 18 * * *' # 03:17 KST
  workflow_dispatch:

jobs:
  backend-integration:
    name: Backend Testcontainers integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DB_PASSWORD: ongo_password
      JWT_SECRET: ci-test-jwt-secret-key-must-be-at-least-32-bytes-long
      PLATFORM_TOKEN_ENCRYPTION_KEY: Y2ktdGVzdC1hZXMyNTYtZW5jcnlwdGlvbi1rZXkwMA==
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run integration tests with Docker
        working-directory: backend
        run: ./gradlew test --no-daemon --console=plain
