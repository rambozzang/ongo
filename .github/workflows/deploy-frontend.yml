# 운영 배포(프런트) — Jenkinsfile-frontend 를 옮긴 판.
#
# 백엔드와 같은 러너, 같은 이유다. self-hosted runner 가 운영 서버 안에서 돌기 때문에
# SSH 개방·배포 키 보관이 필요 없다. 자세한 근거는 deploy-backend.yml 머리말 참고.
#
# ## 백엔드와 같은 concurrency 그룹을 쓴다
#
# 둘 다 `/data/ongo/src/deploy` 를 rsync 하고 같은 `deploy.sh` 를 부른다. 동시에 돌면
# 한쪽이 스크립트를 교체하는 중에 다른 쪽이 그것을 실행할 수 있다. 그래서 그룹을
# 공유해 **백엔드 배포와도 직렬화**한다.
name: 운영 배포 (프런트)

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ongo-deploy-production
  cancel-in-progress: false

env:
  SRC_DIR: /data/ongo/src
  # nginx 가 정적 파일을 서비스하는 위치. deploy.sh frontend 가 여기로 산출물을 옮긴다.
  WEB_ROOT: /data/ongo/www
  HEALTH_URL: http://127.0.0.1/

jobs:
  deploy:
    name: 빌드 후 운영 배포
    runs-on: [self-hosted, ongo-prod]
    timeout-minutes: 30

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 배포 대상 확인
        run: |
          set -euo pipefail
          echo "트리거: ${{ github.event_name }} / 커밋: ${{ github.sha }}"
          echo "node $(node -v) / npm $(npm -v)"
          df -h /data | tail -1
          bash -n deploy/deploy.sh deploy/start.sh deploy/stop.sh deploy/required-env.sh

      # ── 1) 빌드 ─────────────────────────────────────────────────────────
      #
      # 검증 순서를 Jenkins 와 같게 둔다. **빌드보다 테스트를 앞에** 두어, 깨진 코드가
      # 산출물까지 가지 않게 한다.
      - name: 의존성 설치
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: 취약점 점검
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: 테스트·타입·린트
        working-directory: frontend
        run: |
          set -euo pipefail
          npm run test -- --run
          npx vue-tsc --noEmit -p tsconfig.app.json
          npm run lint -- --quiet

      - name: 빌드
        working-directory: frontend
        run: |
          set -euo pipefail
          # 운영은 상대 경로를 쓴다. 절대 URL 을 박으면 도메인이 바뀔 때 번들을 다시 만들어야 하고,
          # 그 사이 배포된 번들이 옛 도메인을 계속 부른다.
          VITE_API_BASE_URL=/api/v1 npm run build
          test -f dist/index.html || { echo "::error::빌드 산출물이 없습니다"; exit 1; }
          du -sh dist

      # ── 2) 배포 ─────────────────────────────────────────────────────────
      - name: 운영 소스 동기화
        run: |
          set -euo pipefail
          mkdir -p "$SRC_DIR/frontend" "$SRC_DIR/deploy"
          # frontend·deploy 만 동기화한다. 백엔드 소스와 JAR 은 건드리지 않는다.
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='node_modules' \
            frontend/ "$SRC_DIR/frontend/"
          rsync -a --delete --exclude='.git' --exclude='.github' \
            deploy/ "$SRC_DIR/deploy/"

      - name: 배포
        run: |
          set -euo pipefail
          JENKINS_NODE_COOKIE=dontKillMe bash "$SRC_DIR/deploy/deploy.sh" frontend \
            --skip-git --skip-build

      # ── 3) 헬스체크 ─────────────────────────────────────────────────────
      #
      # index.html 이 응답하는지만 본다. **JS 청크까지 확인하지는 않는다** — 배포 직후
      # 이전 청크가 지워져 생기는 문제는 프런트의 router.onError 자동 새로고침이 처리한다.
      - name: 헬스체크
        run: |
          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" || echo "000")
            echo "헬스체크 $i/10: HTTP $CODE"
            case "$CODE" in 2*|3*) echo "통과"; exit 0 ;; esac
            sleep 3
          done
          echo "::error::헬스체크 실패 — nginx 상태와 산출물 확인:"
          ls -la "$WEB_ROOT" 2>/dev/null | head -10 || true
          exit 1

      - name: 배포 요약
        if: always()
        run: |
          {
            echo "### 프런트 배포 ${{ job.status }}"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 커밋 | \`${{ github.sha }}\` |"
            echo "| 트리거 | ${{ github.event_name }} |"
            echo "| 웹루트 | \`$WEB_ROOT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
