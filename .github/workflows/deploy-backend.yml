# 운영 배포(백엔드) — Jenkinsfile-backend 를 옮긴 판.
#
# self-hosted runner 가 **운영 서버 안에서** 돌기 때문에 SSH 개방·배포 키 보관이 필요 없다.
# (oth-backend·oth-frontend·python-rag 가 같은 구조다.) onGo 의 Jenkins 도 이미 운영 서버
# 안에서 돌고 있었다 — `mkdir -p /data/ongo/src/backend` 와 로컬 rsync 가 그 증거다.
# 그래서 같은 자리에 러너만 바꿔 끼우는 것이 가장 위험이 적다.
#
# ## Jenkins 와 달라진 점 — 브랜치 필터
#
# **Jenkinsfile-backend 에는 브랜치 조건이 없다.** 어느 브랜치를 빌드해도 운영에 배포된다.
# 그 성질을 그대로 옮기면 안 되므로 `branches: [main]` 을 명시한다. 다른 브랜치를
# 배포하려면 workflow_dispatch 로 **의도를 밝히고** 실행해야 한다.
#
# ## 검증은 여기서 하지 않는다
#
# 보안 가드·Flyway 중복·커버리지 게이트는 ci.yml 이 PR 과 push 에서 돌린다.
# 여기서 또 돌리면 같은 검사를 두 번 하면서 배포만 느려진다. 다만 **빌드 산출물이
# 방금 테스트한 것과 같은지**는 여기서 보장한다(아래 artifact 고정).
name: 운영 배포 (백엔드)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:
    inputs:
      rollback:
        description: '직전 JAR 로 롤백 (빌드·배포하지 않음)'
        type: boolean
        default: false

permissions:
  contents: read

# 배포는 직렬. 진행 중인 배포를 중간에 끊지 않는다 — 끊기면 JAR 교체와 재기동 사이에서
# 멈춰 서비스가 내려간 채 남는다.
concurrency:
  group: ongo-deploy-production
  cancel-in-progress: false

env:
  SRC_DIR: /data/ongo/src
  # start.sh 의 SERVER_PORT 폴백 및 nginx proxy_pass 와 같은 값이어야 한다.
  # 셋의 일치는 deploy/server-port-consistency.test.sh 가 고정한다.
  HEALTH_URL: http://127.0.0.1:8070/actuator/health

jobs:
  deploy:
    name: 빌드 후 운영 배포
    runs-on: [self-hosted, ongo-prod]
    timeout-minutes: 40

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 배포 대상 확인
        run: |
          set -euo pipefail
          echo "트리거: ${{ github.event_name }} / 커밋: ${{ github.sha }}"
          java -version 2>&1 | head -1
          df -h /data | tail -1
          # 배포 스크립트가 깨져 있으면 여기서 멈춘다. 뒤로 가면 서비스를 멈춘 뒤에 안다.
          bash -n deploy/deploy.sh deploy/start.sh deploy/stop.sh deploy/required-env.sh

      # ── 롤백 모드 — 빌드·배포 단계는 건너뛴다 ───────────────────────────
      - name: 롤백 (직전 JAR 복원)
        if: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          BACKUP_DIR=/data/ongo/backup
          PREV=$(ls -1t "$BACKUP_DIR"/ongo-api-*.jar 2>/dev/null | head -1)
          [ -n "$PREV" ] || { echo "::error::되돌릴 이전 JAR 이 없습니다 ($BACKUP_DIR)"; exit 1; }
          echo "롤백 대상: $PREV"
          JENKINS_NODE_COOKIE=dontKillMe bash "$SRC_DIR/deploy/deploy.sh" backend \
            --skip-git --skip-build --artifact="$PREV"

      # ── 1) 빌드 ─────────────────────────────────────────────────────────
      #
      # 배포 노드에는 Docker 가 없다. Testcontainers `*IT` 는 integration-nightly.yml 이
      # 맡고 여기서는 단위 테스트와 패키징만 본다(Jenkins 와 같은 범위).
      - name: 빌드 및 단위 테스트
        if: ${{ !inputs.rollback }}
        working-directory: backend
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # repository-wide clean — 삭제된 Kotlin 클래스가 bootJar 에 남지 않게 한다.
          ./gradlew clean \
            :onGo-common:test :onGo-domain:test :onGo-application:test \
            :onGo-infrastructure:test :onGo-api:test :onGo-api:bootJar \
            --no-daemon -PskipIntegrationTests=true

      - name: 커버리지 게이트
        if: ${{ !inputs.rollback }}
        working-directory: backend
        run: |
          set -euo pipefail
          ./gradlew jacocoRootReport --no-daemon -PskipIntegrationTests=true
          ./gradlew jacocoRootCoverageVerification --no-daemon -PskipIntegrationTests=true
          ./gradlew jacocoPublishingPathCoverageVerification --no-daemon -PskipIntegrationTests=true

      # ── 2) 배포 ─────────────────────────────────────────────────────────
      - name: 운영 소스 동기화
        if: ${{ !inputs.rollback }}
        run: |
          set -euo pipefail
          mkdir -p "$SRC_DIR/backend" "$SRC_DIR/deploy"
          # backend·deploy 만 동기화한다. 프런트 산출물(/data/ongo/www)과 운영 자산은
          # 건드리지 않는다 — frontend 워크플로가 따로 관리한다.
          rsync -a --delete --exclude='.git' --exclude='.github' backend/ "$SRC_DIR/backend/"
          rsync -a --delete --exclude='.git' --exclude='.github' deploy/  "$SRC_DIR/deploy/"

      - name: 배포 (사전검증 → 교체 → 재기동)
        if: ${{ !inputs.rollback }}
        run: |
          set -euo pipefail
          # **방금 테스트한 산출물을 명시적으로 넘긴다.**
          # 넘기지 않으면 deploy.sh 가 서버의 build/libs 에 남아 있던 이전 JAR 을 고를 수
          # 있고, 그러면 컴파일이 성공했는데 삭제된 Bean 이 실행된다.
          ARTIFACT="$(find "$PWD/backend/onGo-api/build/libs" -maxdepth 1 -type f \
            -name 'ongo-api-*.jar' ! -name '*-plain.jar' -print -quit)"
          [ -n "$ARTIFACT" ] || { echo "::error::빌드 산출물 JAR 을 찾지 못했습니다"; exit 1; }
          echo "배포 산출물: $ARTIFACT"

          # JENKINS_NODE_COOKIE=dontKillMe 는 러너가 스텝 종료 시 자식 프로세스를 함께
          # 죽이지 않게 한다. deploy.sh 가 setsid 로 앱을 띄우므로 남겨 둔다.
          JENKINS_NODE_COOKIE=dontKillMe bash "$SRC_DIR/deploy/deploy.sh" backend \
            --skip-git --skip-build --artifact="$ARTIFACT"

      # ── 3) 헬스체크 (롤백 모드에서도 돈다) ──────────────────────────────
      #
      # deploy.sh 안에도 기동 확인이 있지만, 그것은 프로세스가 떴는지를 본다.
      # 여기서는 **밖에서 실제로 응답하는지**를 확인한다 — nginx 가 /actuator/health 를
      # 백엔드로 넘기도록 돼 있어야 이 경로가 의미를 갖는다
      # (deploy/nginx-health-proxy.test.sh 가 그 설정을 고정한다).
      - name: 헬스체크
        run: |
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$HEALTH_URL" || echo "000")
            echo "헬스체크 $i/20: HTTP $CODE"
            case "$CODE" in 2*) echo "통과"; exit 0 ;; esac
            sleep 5
          done
          echo "::error::헬스체크 실패 — 최근 로그 40줄:"
          tail -40 /data/ongo/log/backend.log 2>/dev/null || echo "(로그를 읽지 못했습니다)"
          exit 1

      - name: 배포 요약
        if: always()
        run: |
          {
            echo "### 백엔드 배포 ${{ job.status }}"
            echo ""
            echo "| 항목 | 값 |"
            echo "| --- | --- |"
            echo "| 커밋 | \`${{ github.sha }}\` |"
            echo "| 트리거 | ${{ github.event_name }} |"
            echo "| 롤백 모드 | ${{ inputs.rollback }} |"
            echo "| 헬스 | \`$HEALTH_URL\` |"
          } >> "$GITHUB_STEP_SUMMARY"
