# Production profile overrides
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# The production host keeps the pinned ARM64 ffmpeg build outside PATH.
# Allow an explicit FFMPEG_PATH override, but make the deployed default match
# the managed binary so server-side Shorts rendering is available by default.
shorts:
  render:
    ffmpeg-path: ${FFMPEG_PATH:/data/ffmpeg/bin/ffmpeg}
  transcribe:
    # ffprobe 는 같은 배포에 들어 있다. 길이 상한 검사가 이 실행 파일에 걸려 있고,
    # 못 쓰면 쇼츠 실행 생성이 거절된다(모르는 채 진행하지 않는다).
    ffprobe-path: ${FFPROBE_PATH:/data/ffmpeg/bin/ffprobe}

storage:
  type: s3
  bucket: ${R2_BUCKET}
  s3:
    region: auto
    endpoint: https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}

# CORS — 프로덕션에서는 실제 도메인만 허용 (localhost 차단)
cors:
  # APP_BASE_URL is the single-origin production default. Keep the explicit
  # CORS_ALLOWED_ORIGINS override for deployments serving more than one UI,
  # but let the application start safely when an older server .env has not yet
  # added that redundant variable. ProductionConfigurationValidator still
  # rejects localhost, wildcards, and empty values.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:${APP_BASE_URL:}}

logging:
  file:
    name: backend.log

management:
  endpoints:
    web:
      exposure:
        include: health
