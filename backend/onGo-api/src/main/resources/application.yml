server:
  port: 8070
  servlet:
    context-path: /

spring:
  application:
    name: ongo-api
  threads:
    virtual:
      enabled: true

  # DataSource
  datasource:
    url: jdbc:postgresql://localhost:54332/ongo?stringtype=unspecified
    username: ${DB_USERNAME:ongo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 30000
      max-lifetime: 1800000
      pool-name: ongo-hikari
      connection-timeout: 10000
      leak-detection-threshold: 60000
      data-source-properties:
        prepareThreshold: 5

  # jOOQ
  jooq:
    sql-dialect: POSTGRES

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Cache - configured in CaffeineCacheConfig.kt

  # Spring AI - Anthropic (primary)
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy-anthropic-key}
      chat:
        options:
          model: claude-sonnet-4-5-20250514
          max-tokens: 4096
          temperature: 0.7
    openai:
      api-key: ${OPENAI_API_KEY:dummy-openai-key}
    vertex:
      ai:
        gemini:
          enabled: ${GEMINI_ENABLED:false}
          project-id: ${GEMINI_PROJECT_ID:dummy-gemini-project-id}
          location: ${GEMINI_LOCATION:us-central1}
          chat:
            options:
              model: gemini-2.5-pro
              temperature: 0.7

  # Security
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            scope: openid,profile,email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:your-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:your-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/callback/kakao"
            scope: profile_nickname,account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # Servlet multipart
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

# DashScope (Alibaba Cloud Model Studio)
dashscope:
  api-key: ${DASHSCOPE_API_KEY:dummy-dashscope-key}
  base-url: https://coding-intl.dashscope.aliyuncs.com/v1

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000   # 30 minutes
  refresh-token-expiry: 604800000 # 7 days

# MinIO / S3 / R2 Storage
storage:
  type: minio
  bucket: ongo-videos
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
  s3:
    region: ap-northeast-2
    endpoint: ${S3_ENDPOINT:dummy-endpoint}
    access-key: ${S3_ACCESS_KEY:dummy-s3-access}
    secret-key: ${S3_SECRET_KEY:dummy-s3-secret}

# Payment (Toss)
payment:
  toss:
    webhook-secret: ${TOSS_WEBHOOK_SECRET}
  paddle:
    api-key: ${PADDLE_API_KEY}
    webhook-secret: ${PADDLE_WEBHOOK_SECRET}
    client-token: ${PADDLE_CLIENT_TOKEN}
    environment: ${PADDLE_ENVIRONMENT:live}
    price:
      starter: ${PADDLE_PRICE_STARTER:pri_starter_placeholder}
      pro: ${PADDLE_PRICE_PRO:pri_pro_placeholder}
      business: ${PADDLE_PRICE_BUSINESS:pri_business_placeholder}
      starter-yearly: ${PADDLE_PRICE_STARTER_YEARLY:pri_starter_yearly_placeholder}
      pro-yearly: ${PADDLE_PRICE_PRO_YEARLY:pri_pro_yearly_placeholder}
      business-yearly: ${PADDLE_PRICE_BUSINESS_YEARLY:pri_business_yearly_placeholder}
      credit-starter: ${PADDLE_PRICE_CREDIT_STARTER:pri_credit_starter_placeholder}
      credit-basic: ${PADDLE_PRICE_CREDIT_BASIC:pri_credit_basic_placeholder}
      credit-pro: ${PADDLE_PRICE_CREDIT_PRO:pri_credit_pro_placeholder}
      credit-business: ${PADDLE_PRICE_CREDIT_BUSINESS:pri_credit_business_placeholder}

# Platform encryption & OAuth
platform:
  token:
    encryption-key: ${PLATFORM_TOKEN_ENCRYPTION_KEY}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Do not use a fake fallback: YouTube returns API_KEY_INVALID and the UI
    # can offer manual channel entry when this optional lookup key is absent.
    api-key: ${GOOGLE_API_KEY:}
  tiktok:
    client-key: ${TIKTOK_CLIENT_KEY:}
    client-secret: ${TIKTOK_CLIENT_SECRET:}
  twitter:
    client-id: ${TWITTER_CLIENT_ID:dummy-twitter-id}
    client-secret: ${TWITTER_CLIENT_SECRET:dummy-twitter-secret}
  facebook:
    app-id: ${FACEBOOK_APP_ID:dummy-fb-app}
    app-secret: ${FACEBOOK_APP_SECRET:dummy-fb-secret}
  threads:
    app-id: ${THREADS_APP_ID:dummy-threads-app}
    app-secret: ${THREADS_APP_SECRET:dummy-threads-secret}
  pinterest:
    app-id: ${PINTEREST_APP_ID:dummy-pinterest-app}
    app-secret: ${PINTEREST_APP_SECRET:dummy-pinterest-secret}
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:dummy-linkedin-id}
    client-secret: ${LINKEDIN_CLIENT_SECRET:dummy-linkedin-secret}
  wordpress:
    client-id: ${WORDPRESS_CLIENT_ID:dummy-wp-id}
    client-secret: ${WORDPRESS_CLIENT_SECRET:dummy-wp-secret}
  tumblr:
    consumer-key: ${TUMBLR_CONSUMER_KEY:dummy-tumblr-key}
    consumer-secret: ${TUMBLR_CONSUMER_SECRET:dummy-tumblr-secret}
  vimeo:
    client-id: ${VIMEO_CLIENT_ID:dummy-vimeo-id}
    client-secret: ${VIMEO_CLIENT_SECRET:dummy-vimeo-secret}
  dailymotion:
    api-key: ${DAILYMOTION_API_KEY:dummy-dm-api}
    api-secret: ${DAILYMOTION_API_SECRET:dummy-dm-secret}

# onGo 기능별 설정
ongo:
  content-source:
    google-drive:
      client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
      redirect-uri: ${APP_BASE_URL:http://localhost:8777}/api/v1/content-sources/google-drive/callback
      scopes:
        - https://www.googleapis.com/auth/drive.readonly
      oauth-state-secret: ${OAUTH_STATE_SECRET:change-me-32chars-minimum-local-dev-only}
      import:
        download-buffer-size: 8388608
        progress-update-interval-ms: 2000
        max-concurrent-per-user: 2
        timeout-minutes: 60

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,https://ongo.codelabtiger.com}

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Resilience4j — 플랫폼 API 호출 안정성
resilience4j:
  retry:
    instances:
      platformApi:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.ongo.common.exception.PlatformUploadException
      aiApi:
        max-attempts: 2
        wait-duration: 3s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      platformApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 80
      aiApi:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 60s
        slow-call-rate-threshold: 80

# Logging (production defaults - use application-dev.yml for DEBUG)
logging:
  level:
    root: INFO
    com.ongo: INFO
    org.jooq: WARN
    org.springframework.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ongo-api.log

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    metrics:
      enabled: true
    caches:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,5s
