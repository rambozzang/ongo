server:
  port: 8070
  servlet:
    context-path: /

spring:
  application:
    name: ongo-api
  threads:
    virtual:
      enabled: true

  # DataSource
  datasource:
    # Override this in containers/managed environments; the local Oracle setup
    # uses localhost:54332 by default.
    url: ${DB_URL:jdbc:postgresql://localhost:54332/ongo?stringtype=unspecified}
    username: ${DB_USERNAME:ongo}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # 최소 2 이상이어야 한다. 스케줄러가 advisory lock 용 커넥션 1개를 배치가 끝날 때까지
      # 점유하고, 실제 작업은 별도 커넥션에서 돌기 때문이다. 1로 낮추면 배치가 커넥션을
      # 못 얻어 connection-timeout 뒤 항목마다 실패한다. 실사용 기준으로는 여유 있게 둔다.
      # leak-detection-threshold 를 넘는 장시간 배치는 락 커넥션에 대해 leak 경고를 남기는데,
      # 실제 누수가 아니라 의도된 lease 다. 예상 최대 배치 시간에 맞춰 조정한다.
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 30000
      max-lifetime: 1800000
      pool-name: ongo-hikari
      connection-timeout: 10000
      leak-detection-threshold: 60000
      data-source-properties:
        prepareThreshold: 5
        # PostgreSQL enum 컬럼(visibility_type, plan_type, user_role 등 20종 이상)에
        # 문자열을 바인딩할 수 있게 한다. 없으면 드라이버가 varchar 로 보내고
        # PostgreSQL 은 varchar → enum 암묵 캐스팅을 허용하지 않아
        #   column "default_visibility" is of type visibility_type
        #   but expression is of type character varying
        # 로 INSERT/UPDATE 가 전부 실패한다.
        #
        # url 기본값에도 ?stringtype=unspecified 가 붙어 있지만 거기에만 두면 안 된다.
        # DB_URL 을 재정의하는 환경에서 쿼리 파라미터가 빠지면 조용히 사라지고,
        # enum 을 쓰는 쓰기 경로가 실제로 실행될 때까지 아무도 모른다.
        # 실제로 운영 .env 의 DB_URL 에서 이 파라미터가 누락돼 회원가입이 막혔다.
        # 여기 두면 URL 을 어떻게 주든 항상 적용된다.
        stringtype: unspecified

  # jOOQ
  jooq:
    sql-dialect: POSTGRES

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration

  # Cache - configured in CaffeineCacheConfig.kt

  # Spring AI - Anthropic (primary)
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:dummy-anthropic-key}
      chat:
        options:
          model: claude-sonnet-4-5-20250514
          max-tokens: 4096
          temperature: 0.7
    openai:
      api-key: ${OPENAI_API_KEY:dummy-openai-key}
    google:
      genai:
        enabled: ${GEMINI_ENABLED:false}
        api-key: ${GEMINI_API_KEY:dummy-gemini-key}
        project-id: ${GEMINI_PROJECT_ID:dummy-gemini-project-id}
        location: ${GEMINI_LOCATION:us-central1}
        vertex-ai: ${GEMINI_VERTEX_AI:false}
        chat:
          enabled: ${GEMINI_ENABLED:false}
          model: gemini-2.5-pro
          temperature: 0.7

  # Security
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-client-secret}
            scope: openid,profile,email
          kakao:
            client-id: ${KAKAO_CLIENT_ID:your-client-id}
            client-secret: ${KAKAO_CLIENT_SECRET:your-client-secret}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/api/v1/auth/callback/kakao"
            scope: profile_nickname,account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # Servlet multipart
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

# DashScope (Alibaba Cloud Model Studio)
dashscope:
  api-key: ${DASHSCOPE_API_KEY:dummy-dashscope-key}
  base-url: https://coding-intl.dashscope.aliyuncs.com/v1

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000   # 30 minutes
  refresh-token-expiry: 604800000 # 7 days

# MinIO / S3 / R2 Storage
storage:
  type: minio
  bucket: ongo-videos
  minio:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
  s3:
    region: ap-northeast-2
    endpoint: ${S3_ENDPOINT:dummy-endpoint}
    access-key: ${S3_ACCESS_KEY:dummy-s3-access}
    secret-key: ${S3_SECRET_KEY:dummy-s3-secret}

# Comma-separated capability keys can be disabled during a staged rollout.
# The key remains in the contract with enabled=false so clients do not fall
# back to a hardcoded menu when an operational feature is intentionally off.
capabilities:
  disabled: ${CAPABILITIES_DISABLED:}

# URL 임포트 (YouTube/TikTok/Instagram)
#
# 운영 전제: yt-dlp 바이너리와 ffmpeg 가 호스트에 설치돼 있어야 한다.
# deploy/start.sh 는 JAR 을 호스트에서 직접 실행하므로 도커 이미지에 넣는 방식이 통하지 않는다.
# 없으면 임포트 요청이 실패한다. 서버 준비는 배포 담당자가 한다.
videodownload:
# PATH 에서 찾고, 인프라 어댑터가 운영 호스트의 표준 경로도 확인한다.
# 다른 경로에 설치했으면 절대 경로로 재정의한다.
  yt-dlp-path: ${YT_DLP_PATH:yt-dlp}

# 쇼츠 서버 렌더링
#
# CPU/디스크를 장시간 점유하는 ffmpeg 작업의 동시 실행 수다. QUEUED 작업은
# 영속 작업 상태를 먼저 기록한 뒤 이 한도를 기다리며, 일반 API 요청과 자원을 경쟁하지 않는다.
shorts:
  render:
    max-concurrent: ${SHORTS_RENDER_MAX_CONCURRENT:1}
    # ffmpeg 바이너리 위치. 기본값은 PATH 에서 찾는다(로컬 개발용).
    #
    # 운영 호스트는 /data/ffmpeg/bin/ffmpeg 에 설치돼 있고 PATH 에 없다.
    # start.sh 가 FFMPEG_PATH 를 보완하며, 애플리케이션도 동일한 표준 경로를
    # 확인한다. 명시적인 FFMPEG_PATH 가 있으면 그것이 항상 우선한다.
    #
    # 설정이 맞는지는 GET /api/v1/ugc/shorts/render/availability 로 확인할 수 있다.
    # 화면은 그 값으로 렌더 버튼을 감추므로, 잘못 설정하면 사용자에게 버튼이 안 보인다.
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    # 인코딩 상한. 긴 원본에서 무한정 물고 있지 않게 한다.
    timeout-seconds: ${SHORTS_RENDER_TIMEOUT_SECONDS:1800}
    # 화질/속도. crf 는 낮을수록 고화질·큰 용량이다.
    crf: ${SHORTS_RENDER_CRF:20}
    preset: ${SHORTS_RENDER_PRESET:medium}
  # 쇼츠 전사(TRANSCRIBE) 입력 준비
  #
  # 원본 영상을 그대로 전사 모델에 넘기지 않는다. 같은 ffmpeg 바이너리로 오디오만 뽑아
  # 아래 길이로 조각내 순차 전사한다. 조각 크기는 제공자 한도를 추정한 값이 아니라
  # 우리가 감당하기로 정한 보수적인 상한이다 — 제공자 한도가 바뀌어도 이 값은 여전히
  # 그 아래에 있도록 넉넉히 잡는다.
  #
  # 기본값 600초 × 모노 16kHz 64kbps ≈ 4.8MB/조각.
  transcribe:
    part-seconds: ${SHORTS_TRANSCRIBE_PART_SECONDS:600}
    audio-bitrate: ${SHORTS_TRANSCRIBE_AUDIO_BITRATE:64k}
    prepare-timeout-seconds: ${SHORTS_TRANSCRIBE_PREPARE_TIMEOUT_SECONDS:1800}
    # 길이 측정용. ffmpeg 배포에 같이 들어 있어 경로가 나란하다. 운영 호스트는 PATH 에
    # 없으므로 application-prod.yml 이 절대 경로를 준다.
    ffprobe-path: ${FFPROBE_PATH:ffprobe}
    # 길이 측정은 헤더만 읽으므로 짧게 잡는다. 여기서 오래 매달리면 실행 생성 API 가 같이 느려진다.
    probe-timeout-seconds: ${SHORTS_TRANSCRIBE_PROBE_TIMEOUT_SECONDS:30}
    # 이 크기를 넘는 원본은 실행을 만들기 전에 거절한다. 단계 중간에 실패시키면
    # 사용자는 크레딧이 걸린 뒤에야 알게 된다. 기본 2GiB.
    max-source-bytes: ${SHORTS_TRANSCRIBE_MAX_SOURCE_BYTES:2147483648}
    # 크기와 별개인 상한. 저화질 롱폼은 작고 길어서 크기 검사를 통과하는데, 조각 수와
    # 전사 요금·렌더 큐 대기는 길이에 비례한다. 바이트로 길이를 추정하지 않고 ffprobe 로
    # 실제로 재서 이 값과 비교한다. 기본 3시간.
    max-source-duration-ms: ${SHORTS_TRANSCRIBE_MAX_SOURCE_DURATION_MS:10800000}

# 작성 화면에서 생성하는 텍스트 슬라이드 영상
# 동일한 ffmpeg 바이너리를 사용하며, 생성 요청은 이 시간 안에 끝나지 않으면 실패 처리한다.
video:
  generation:
    timeout-seconds: ${VIDEO_GENERATION_TIMEOUT_SECONDS:180}
    tts:
      base-url: ${OPENAI_TTS_BASE_URL:https://api.openai.com/v1}
      model: ${OPENAI_TTS_MODEL:gpt-4o-mini-tts}

public-api:
  oauth:
    callback-url: ${PUBLIC_OAUTH_CALLBACK_URL:${APP_BASE_URL:http://localhost:8070}/api/v1/public/v1/social/callback}
    success-redirect: ${PUBLIC_OAUTH_SUCCESS_REDIRECT:${APP_BASE_URL:http://localhost:3000}/channels}

# Payment (PortOne V2)
payment:
  portone:
    store-id: ${PORTONE_STORE_ID:}
    channel-key: ${PORTONE_CHANNEL_KEY:}
    api-secret: ${PORTONE_API_SECRET:}
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:}
  # Legacy adapters remain available for existing records, but are not used by the checkout UI.
  toss:
    secret-key: ${TOSS_SECRET_KEY:}
    webhook-secret: ${TOSS_WEBHOOK_SECRET:}
  paddle:
    api-key: ${PADDLE_API_KEY:}
    webhook-secret: ${PADDLE_WEBHOOK_SECRET:}
    client-token: ${PADDLE_CLIENT_TOKEN:}
    environment: ${PADDLE_ENVIRONMENT:sandbox}
    price:
      starter: ${PADDLE_PRICE_STARTER:pri_starter_placeholder}
      pro: ${PADDLE_PRICE_PRO:pri_pro_placeholder}
      business: ${PADDLE_PRICE_BUSINESS:pri_business_placeholder}
      starter-yearly: ${PADDLE_PRICE_STARTER_YEARLY:pri_starter_yearly_placeholder}
      pro-yearly: ${PADDLE_PRICE_PRO_YEARLY:pri_pro_yearly_placeholder}
      business-yearly: ${PADDLE_PRICE_BUSINESS_YEARLY:pri_business_yearly_placeholder}
      credit-starter: ${PADDLE_PRICE_CREDIT_STARTER:pri_credit_starter_placeholder}
      credit-basic: ${PADDLE_PRICE_CREDIT_BASIC:pri_credit_basic_placeholder}
      credit-pro: ${PADDLE_PRICE_CREDIT_PRO:pri_credit_pro_placeholder}
      credit-business: ${PADDLE_PRICE_CREDIT_BUSINESS:pri_credit_business_placeholder}

# Platform encryption & OAuth
platform:
  token:
    encryption-key: ${PLATFORM_TOKEN_ENCRYPTION_KEY}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    # Do not use a fake fallback: YouTube returns API_KEY_INVALID and the UI
    # can offer manual channel entry when this optional lookup key is absent.
    api-key: ${GOOGLE_API_KEY:}
  instagram:
    app-id: ${INSTAGRAM_APP_ID:}
    app-secret: ${INSTAGRAM_APP_SECRET:}
  tiktok:
    client-key: ${TIKTOK_CLIENT_KEY:}
    client-secret: ${TIKTOK_CLIENT_SECRET:}
  twitter:
    client-id: ${TWITTER_CLIENT_ID:}
    client-secret: ${TWITTER_CLIENT_SECRET:}
  facebook:
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}
  threads:
    app-id: ${THREADS_APP_ID:}
    app-secret: ${THREADS_APP_SECRET:}
  pinterest:
    app-id: ${PINTEREST_APP_ID:}
    app-secret: ${PINTEREST_APP_SECRET:}
  linkedin:
    client-id: ${LINKEDIN_CLIENT_ID:}
    client-secret: ${LINKEDIN_CLIENT_SECRET:}
  wordpress:
    client-id: ${WORDPRESS_CLIENT_ID:}
    client-secret: ${WORDPRESS_CLIENT_SECRET:}
  tumblr:
    consumer-key: ${TUMBLR_CONSUMER_KEY:}
    consumer-secret: ${TUMBLR_CONSUMER_SECRET:}
  vimeo:
    client-id: ${VIMEO_CLIENT_ID:}
    client-secret: ${VIMEO_CLIENT_SECRET:}
  dailymotion:
    api-key: ${DAILYMOTION_API_KEY:}
    api-secret: ${DAILYMOTION_API_SECRET:}

# onGo 기능별 설정
ongo:
  content-source:
    google-drive:
      client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
      redirect-uri: ${APP_BASE_URL:http://localhost:8777}/api/v1/content-sources/google-drive/callback
      scopes:
        - https://www.googleapis.com/auth/drive.readonly
      oauth-state-secret: ${OAUTH_STATE_SECRET:change-me-32chars-minimum-local-dev-only}
      import:
        download-buffer-size: 8388608
        progress-update-interval-ms: 2000
        max-concurrent-per-user: 2
        timeout-minutes: 60

# CORS
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://localhost:5173,https://ongo.codelabtiger.com}

# Springdoc / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Resilience4j — 플랫폼 API 호출 안정성
resilience4j:
  retry:
    instances:
      platformApi:
        max-attempts: 3
        wait-duration: 2s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException
        ignore-exceptions:
          - com.ongo.common.exception.PlatformUploadException
      aiApi:
        max-attempts: 2
        wait-duration: 3s
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpClientErrorException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      platformApi:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 30s
        slow-call-rate-threshold: 80
      aiApi:
        sliding-window-size: 10
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        slow-call-duration-threshold: 60s
        slow-call-rate-threshold: 80

# Logging (production defaults - use application-dev.yml for DEBUG)
logging:
  level:
    root: INFO
    com.ongo: INFO
    org.jooq: WARN
    org.springframework.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{requestId:-}] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ongo-api.log

# Actuator & Monitoring
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
    metrics:
      enabled: true
    caches:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,500ms,1s,5s
