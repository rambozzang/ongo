services:
  postgres:
    image: postgres:16
    container_name: ongo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ongo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ongo_password}
      POSTGRES_DB: ${POSTGRES_DB:-ongo_db}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ongo_user} -d $${POSTGRES_DB:-ongo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ongo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      # MinIO 기본 CORS가 모든 origin 허용 — 프론트엔드 직접 PUT 업로드 가능
      # 프로덕션(R2/S3)에서는 버킷 CORS 정책을 별도 설정 필요
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
