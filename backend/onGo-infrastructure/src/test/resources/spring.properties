# 통합 테스트는 클래스마다 자기 PostgreSQL 컨테이너를 띄운다(@Container static + @DynamicPropertySource).
# 그래서 끝난 클래스의 Spring 컨텍스트는 이미 내려간 컨테이너를 가리키고, 다시 쓰일 일이 없다.
#
# 기본 캐시(32개)는 그런 컨텍스트를 전부 붙들고 있었다. IT 가 30개를 넘자 테스트 JVM(기본 512MB)이
# OutOfMemoryError 로 죽고, 죽은 컨테이너에 접속을 시도하던 Hikari 풀이 다른 테스트를
# "Connection is not available (total=0)" 로 실패시켰다. 가장 최근 몇 개만 남긴다.
spring.test.context.cache.maxSize=4
