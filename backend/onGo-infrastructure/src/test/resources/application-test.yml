# Infrastructure module integration test config
# datasource.url/username/password 는 @DynamicPropertySource 가 Testcontainers 로부터 주입
spring:
  datasource:
    hikari:
      # PostgreSQL enum 컬럼(content_source_type 등)에 varchar 바인드 시
      # implicit cast 허용하도록 unspecified 로 전송 — 프로덕션 JDBC URL과 동일 전략
      data-source-properties:
        stringtype: unspecified
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: POSTGRES
  main:
    allow-bean-definition-overriding: true
  # 불필요한 자동설정 제외 — infrastructure 모듈은 web/security/ai 계층 없이
  # 순수 jOOQ + Flyway + DataSource 만 필요
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration
      - org.springframework.boot.autoconfigure.security.oauth2.resource.servlet.OAuth2ResourceServerAutoConfiguration
      - org.springframework.ai.autoconfigure.anthropic.AnthropicAutoConfiguration
      - org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration
      - org.springframework.ai.autoconfigure.vertexai.gemini.VertexAiGeminiAutoConfiguration

logging:
  level:
    org.flywaydb: INFO
    org.jooq: WARN
    org.testcontainers: INFO
    com.zaxxer.hikari: WARN
