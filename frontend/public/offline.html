<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>onGo - 오프라인</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard Variable', -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f6fa;
      color: #646979;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 400px; }
    .icon { font-size: 64px; margin-bottom: 24px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #181a27; letter-spacing: -0.03em; }
    p { font-size: 15px; color: #646979; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: #5659d6;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #4548bd; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>인터넷에 연결할 수 없습니다</h1>
    <p>네트워크 연결을 확인한 후 다시 시도해주세요.<br/>일부 기능은 오프라인에서도 사용할 수 있습니다.</p>
    <button onclick="window.location.reload()">다시 시도</button>
  </div>
</body>
</html>
