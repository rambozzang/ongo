<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d2030"/>
      <stop offset="1" stop-color="#101120"/>
    </linearGradient>
  </defs>
  <!-- 타일 — 리디자인 표면 토큰(bg-surface-raised → bg-surface-base) -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="1" y="1" width="510" height="510" rx="111" fill="none" stroke="#2e3250" stroke-width="2"/>
  <!-- 순환 화살 링 — 여러 플랫폼으로 도는 자동 업로드. accent 마젠타 oklch(0.78 0.15 320) ≈ #E196F3 -->
  <path d="M 365 216 A 116 116 0 1 1 296 147" fill="none" stroke="#E196F3" stroke-width="42" stroke-linecap="round"/>
  <path d="M 326 158 L 310 126 L 292 171 Z" fill="#E196F3" stroke="#E196F3" stroke-width="10" stroke-linejoin="round"/>
  <!-- 재생 버튼 — 크리에이터 영상 -->
  <path d="M 230 200 L 230 312 L 328 256 Z" fill="#e8e9f2" stroke="#e8e9f2" stroke-width="26" stroke-linejoin="round"/>
</svg>
