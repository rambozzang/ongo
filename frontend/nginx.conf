server {
    listen 80;
    server_name localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8070/api/;
        # 업로드 본문 상한. 백엔드가 실제로 허용하는 크기와 같게 맞춘다
        # (FileValidationUtil.DEFAULT_MAX_FILE_SIZE = 2GB, AssetController 도 2GB).
        #
        # nginx 기본값은 1MB 다. 명시하지 않으면 에셋 업로드(POST /api/v1/assets),
        # 이미지 게시(POST /api/v1/videos/{id}/images), 쇼츠 시트·템플릿 업로드가
        # 1MB 를 넘는 순간 프록시에서 413 으로 잘린다 — 백엔드까지 닿지도 않아
        # 서버 로그에 아무것도 남지 않는다.
        #
        # **영상 업로드는 여기를 지나지 않는다.** presigned URL 로 R2 에 직접 PUT 하고
        # (usePresignedUpload), 이 경로로는 작은 JSON(init/complete)만 오간다.
        #
        # `location /api/` 안에만 둔다. 정적 파일과 웹소켓은 큰 요청 본문을 받지 않으므로
        # 서버 전체로 올리면 필요 없는 곳까지 버퍼 한도를 넓히는 것이 된다.
        client_max_body_size 2g;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~* \.map$ {
        return 404;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
